title: 5. Kastanienwald
fuchs: |
  Der Wald bietet uns viele köstliche Lebensmittel: Esskastanien, Pilze und sogar Schnecken waren
  früher für die Ernährung der Landbevölkerung unverzichtbar. Heute sind sie beliebte lokale Spezialitäten
  und ein wichtiger Faktor für den Tourismus. Diese natürlichen Ressourcen zeigen, wie reich und vielfältig
  unsere Wälder sind und wie sie uns seit jeher ernähren.
  In der Verbandsgemeinde Annweiler, zu der Wernersberg gehört, wird jedes Jahr beim Keschdefeschd eine
  Kastanienprinzessin gewählt, die unsere Region touristisch repräsentiert.
  Mehr dazu unter https://www.suedlicheweinstrasse.de/keschdefeschd

eichhoernchen: |
  Der Pfad ist hier recht schmal, also machen wir eine Übung auf der Stelle! Stell dich auf
  ein Bein und versuche, das Gleichgewicht zu halten. Zähle bis 20. Schaffst Du es, ohne den Boden mit
  dem anderen Fuß zu berühren? Wenn das zu einfach ist, schließe die Augen dabei! Das trainiert Deinen
  Gleichgewichtssinn und macht auch noch Spaß. Wechsle danach das Bein und probiere es noch einmal.
  Wer auch dann noch sicher steht, sollte vorsichtig mit Kastanien, die man auf dem Boden findet (nicht den stacheligen Hülsen!), jonglieren.
