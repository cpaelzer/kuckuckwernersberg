title: 2. Wasserdepot
fuchs: Hier vor dem Wasserspeicher lohnt es sich, einmal über die öffentliche Wasserversorgung nachzudenken.
  Wusstest du, dass der Wasserdruck in den Leitungen je nach Höhe unterschiedlich ist? Im Oberdorf ist
  der Druck oft niedriger als im Unterdorf, weil die Wassersäule relativ zum örtlichen Speicher steht.
  Wenn man zu nahe am Wasserspeicher wohnt, kann der Druck sogar so niedrig sein, dass man Pumpen braucht,
  um den Druck zu regulieren.
eichhoernchen: Suche dir einen Wanderstock! Ein Wanderstock kann dir helfen, deine Balance zu halten und
  deine Wanderung angenehmer zu gestalten. Probier doch mal aus, wie es sich anfühlt, mit einem Stock
  zu gehen. Du wirst sehen, es macht nicht nur Spaß, sondern entlastet auch deine Gelenke. Und wer weiß,
  vielleicht findest du sogar einen schönen Stock hier in der Nähe!
