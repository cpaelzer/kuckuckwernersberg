title: 6. Sandsteinabbau
fuchs: 'Für lange Zeit musste die Landbevölkerung hauptsächlich das nutzen, was verfügbar war, da sie
  arm war. Diese Stelle hier war früher eine Sandgrube, aber es wurde nicht nur Sand genutzt. Wenn man
  genau hinschaut, findet man im Ort oft Sandsteine von den Felsen der Umgebung, die für den Bau der Keller
  genutzt wurden. Auch klassische Fachwerkhäuser wurden mit dem Material gebaut, das verfügbar war. Dies
  zeigt, wie die Menschen früher kreativ und ressourcenbewusst lebten (oder besser leben mussten)!

  Hier sieht man noch Spuren vom Sandsteinabbau durch die Bevölkerung.'
eichhoernchen: Finde einen schönen, gerade gefertigten Sandstein (lass ihn aber bitte für den nächsten
  liegen).
kuckuck:
  hint: “... Aufwärts”
  placement: etwas weiter den Weg hoch (was dem Ziel entgegen führt)
