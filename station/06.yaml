title: 6. Sandsteinabbau
fuchs: |
  Für lange Zeit musste die Landbevölkerung hauptsächlich das nutzen, was verfügbar war.
  An dieser Stelle hier wurden früher Sandsteine abgebaut. Am Hang sieht man noch Reste der
  gebrochenen Steine, welche den Anforderungen nicht genügten. Am ganzen Berg entlang, kann
  man solche Abbaustellen finden. Wenn man genau hinschaut, entdeckt man im Ort oft Sandsteine
  von den Felsen der Umgebung, die für den Bau der Häuser und vor allem Keller
  genutzt wurden. Auch klassische Fachwerkhäuser wurden mit dem Material gebaut, das verfügbar
  war. Dies zeigt, wie die Menschen früher kreativ und ressourcenbewusst lebten (oder besser
  leben mussten).
eichhoernchen: |
  Finde einen schönen Sandstein mit geraden Kanten (lass ihn aber bitte für den nächsten liegen).
