title: 3. Des sin Butzle!
fuchs: 'Oft wird behauptet, dass die Bevölkerung in Polarregionen viele Wörter für Eis hat. Das können wir nicht prüfen - aber man kann erkennen,
  dass der Pfälzer den Wald stärker unterscheidet. Zum Beispiel stehen hier viele Kiefern und später am Weg auch
  manchmal Tannen. Im Hochdeutschen sind all dies “Zapfen”, nur unterschieden mittels dem Baum als Präfix
  “Tannen-zapfen”, “Kiefern-Zapfen”, etc.

  Im örtlichen Dialekt sind dies aber gänzlich verschiedene Worte, “Tannen-Zapfen” sind “Zapple” wobei man die Herkunft
  noch erkennt. Jedoch sind “Kiefern-Zapfen” ganz klar “Buzzle” und damit etwas völlig anderes. Letztere haben übrigens,
  gerade in Verbindung mit Wachsresten, auch gerne mal als Anzündhilfe gedient.'
eichhoernchen: Du wirst nun eine Weile bergauf laufen. Versuche doch einmal, rückwärts zu gehen! Ist das
  einfacher? Überlege mal, warum wir nicht immer rückwärts laufen? Vielleicht fällt Dir auf, dass es Deine
  Muskeln anders fordert und Deine Balance verbessert. Probiere es aus und beobachte, wie sich dein Körper
  anfühlt.
