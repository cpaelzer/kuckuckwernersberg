title: 11. Wegespinne
fuchs: 'Die Waldwirtschaft im Pfälzer Wald hat sich im Laufe der Geschichte stark verändert. Früher war
  der Wald hauptsächlich eine Quelle für Brennholz und Baumaterial, heute spielt er eine wichtige Rolle
  für den Naturschutz und die Erholung. Dabei gibt es verschiedene Arten von Wald: Privatwald, Gemeindewald
  und Staatswald. Jede dieser Waldformen hat ihre eigene Bedeutung und Verwaltung. Die Landesforsten Rheinland-Pfalz
  spielen dabei eine entscheidende Rolle, indem sie den Wald nachhaltig bewirtschaften und schützen!'
eichhoernchen: Schau Dich um, hier gibt es an einer Stelle viele verschiedene Baumarten - Direkt hier
  gibt es Kiefern, Birken, Buchen, Kastanien und Eichen. Wie viele können du und Deine Begleiter erkennen?
