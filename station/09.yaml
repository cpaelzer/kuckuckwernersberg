title: 9. Burgenblick
fuchs: |
  Von diesem Aussichtspunkt aus blickst Du auf eine der burgenreichsten Regionen Deutschlands. Im
  Mittelalter, zur Zeit der Stauferkaiser im 12. und 13. Jahrhundert, erlebten die Burgen hier ihre Blütezeit.
  Der berühmteste unter den Staufern, Kaiser Friedrich Barbarossa, ließ die Reichsburg Trifels zur Reichsfeste
  ausbauen. Hier wurden sogar die Reichskleinodien – Krone, Zepter und Reichsapfel – aufbewahrt.

  Die Staufer kontrollierten von diesen Höhenburgen aus die wichtigen Handelswege durch das Trifelsland.
  Neben dem Trifels entstanden in Sichtweite die Burgen Anebos und Neu-Scharfeneck, die zusammen eine beeindruckende
  Burgenlandschaft bilden. Richard Löwenherz, der englische König, war übrigens von 1193 bis 1194 Gefangener
  auf dem Trifels – eine der bekanntesten Geschichten der Region.

  Die Stauferzeit endete im 13. Jahrhundert, doch die Burgen prägen bis heute das Landschaftsbild und
  sind beliebte Ausflugsziele.

eichhoernchen: |
  Späht in die Weite, wie viele Ruinen könnt Ihr erkennen. Tipp: Es sind mehr als drei.
