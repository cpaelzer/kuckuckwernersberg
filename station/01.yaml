title: 1. Abmarsch am Schützenhaus
fuchs: 'Alle Orte hier in der Südpfalz haben sogenannte ''Uznamen'', also besondere Spitznamen für
  deren Einwohner, die oft mit Stolz, aber manchmal auch zum Spaß verwendet werden. Die Bewohner der Gemeinde Wernersberg
  nennt man Guggugge (=Kuckucke). Andere Uznamen in der Umgebung sind: Gosserweiler: Hawwerflichel (=Dreschflegel), Stein:
    Gäns (=Gänse), Albersweiler: Stääisel (=Steinesel), Annweiler: Gääsböck (=Geißböcke). Diese Namen erzählen oft eine kleine Geschichte
  über den Ort und seine Bewohner. Die Namensherkunft der Guggugge in Wernersberg wird im Volksmund der Kerwe (=Kirchweih) zugeschrieben, die
  stets am zweiten Wochenende im Mai stattfindet und zeitlich mit dem ersten Lockruf des namensgebenden
  Kuckucks einhergehen soll.'
eichhoernchen: Mach ein paar Kniebeugen zum Aufwärmen! Stell Dich hüftbreit hin, streck die Arme nach
  vorne aus und beuge dann die Knie, als würdest Du Dich auf einen Stuhl setzen. Halte die Position kurz
  und steh dann wieder auf. Wiederhole das 10 Mal. Das bringt deinen Kreislauf in Schwung und macht Dich
  fit für die nächste Station.
