title: 1. Abmarsch am Schützenhaus
fuchs: 'Alle Orte hier in der Südpfalz haben sogenannte ''Uznamen'', also besondere Bezeichnungen für
  die Einwohner, die oft mit Stolz, aber manchmal auch zum Spaß verwendet werden. In der Gemeinde Wernersberg
  ist dies der ''Kuckuck''. Andere Uznamen in der Umgebung sind: Gosserweiler - Dreschflegel, Stein -
  Gänse, Albersweiler - Steinesel, Annweiler - Ziegenbock. Diese Namen erzählen oft eine kleine Geschichte
  über den Ort und seine Bewohner! Die Namensherkunft wird im Volksmund der Kirchweih zugeschrieben, die
  stets am zweiten Wochenende im Mai stattfindet und zeitlich mit dem ersten Lockruf des namensgebenden
  Kuckucks einhergehen soll.'
eichhoernchen: Mach ein paar Kniebeugen zum Aufwärmen! Stell dich hüftbreit hin, streck die Arme nach
  vorne aus und beuge dann die Knie, als würdest du dich auf einen Stuhl setzen. Halte die Position kurz
  und steh dann wieder auf. Wiederhole das 10 Mal. Das bringt deinen Kreislauf in Schwung und macht dich
  fit für die nächste Station!
kuckuck:
  hint: “... etwas höher”
  placement: Auf dem Straßenschild “Osterbrunnen”
