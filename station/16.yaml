title: 16. Licht und Schatten
fuchs: |
  Berge haben sowohl Schatten- als auch Lichtseiten, die einen großen Einfluss auf die Vegetation
  haben. Auf der Sonnenseite wachsen oft andere Pflanzen als auf der schattigen Seite. Dies führt auch
  zu einer unterschiedlichen Bepflanzung in der Waldwirtschaft. Die Sonnen- und Schattenseiten bieten
  verschiedene Lebensbedingungen für Pflanzen und Tiere, was die Vielfalt in unseren Wäldern erhöht!

eichhoernchen: |
  Nun bewegen wir uns mit unseren Sinnen! Schließe die Augen und höre Dir den Wald noch einmal
  an, bevor Du dem Ort wieder zu nahe kommst. Was kannst Du entdecken? Vielleicht das Rascheln der Blätter,
  das Zwitschern der Vögel oder das Knacken eines Astes. Diese Übung hilft Dir, die Natur mit allen Sinnen
  zu erleben und zu genießen!
