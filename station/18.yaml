title: 18. Werner!
fuchs: Das Kulturleben in der Ortsgemeinde Wernersberg ist sehr vielfältig und lebendig! Es gibt viele
  Vereine, die das kulturelle Leben bereichern, darunter der Kirchenchor 'St. Cäcilia', die Kuckucksmusikanten,
  der Sängerclub 'Echo', der Schützenverein St. Werner (an dessen Schießanlage wir gerade stehen), der
  SV Wernersberg, der TSV Wernersberg und die freiwillige Feuerwehr. Die Vereine betreiben das ganze Jahr
  über ihre wichtige Sport- und Kulturarbeit - aber auch immer wieder tolle öffentliche Veranstaltungen.
  Schau doch mal im [Veranstaltungskalender Wernersberg](https://www.wernersberg.de/index.php/termine-veranstaltungen)
  vorbei!
eichhoernchen: Wir hören den Kuckuck heute wohl leider nicht mehr – er ist leider sehr selten geworden.
  Aber zum Abschluss kannst du einfach dein Lieblingslied trällern! Singen macht Spaß und bringt gute
  Laune - also, los geht's!
