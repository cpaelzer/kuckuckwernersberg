title: 15. Das Wappen
fuchs: |
  Hinweis zur Heraldik: Wappen werden immer aus der Sicht des Schildträgers beschrieben

  Oben rechts (für Betrachter links): Das Feld mit dem silbernen Adler auf Rot
  repräsentiert die Herren von Dahn (die ebenfalls einen silbernen Adler führten)
  als Inhaber des alten Reichslehens Geisburg, der späteren Herrschaft Burrweiler.

  Oben links (für Betrachter rechts): Der silberne Pfahl auf Blau repräsentiert
  die Herren von der Leyen, an welche die Herrschaft Burrweiler später überging.

  Unten: Die goldene Spitze mit dem gestürzten Y („Hühnerfuß“) trennt als
  lokales Gemarkungszeichen von 1777 die beiden adligen Herrschaftswappen ab.

eichhoernchen: |
  Spielt Verstecken! Hier im Schatten der großen Bäumen geht das besonders gut. Die Distanzen
  sind hier größer - zählt bis dreißig, während sich die anderen verstecken. Wer wird wohl als Erstes
  gefunden? Diese Übung macht nicht nur Spaß, sondern trainiert auch eure Beobachtungsgabe und Schnelligkeit.
  Viel Spaß beim Spielen!
