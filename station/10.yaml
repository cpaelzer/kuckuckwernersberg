title: 10. Grenzstein
fuchs: |
  Ortsgrenzen sind nicht immer dort, wo man sie vermutet! Orte enden nicht einfach an ihrem Ortsschild.
  Hier stehen wir genau am Übergang der Gemarkung zwischen Wernersberg und Annweiler. Gemarkungen sind
  historische Grenzverläufe, die oft über Jahrhunderte bestehen bleiben. Sie sind nicht nur für die Verwaltung
  wichtig, sondern erzählen auch viel über die Geschichte unserer Region.

  Gerade bei Weideland gab es über die Jahrhunderte öfter Streitigkeiten. Die inoffizielle
  Ortschronik hat gar ein ganzes Kapitel über vier Seiten mit dem Titel "Grenzstreitigkeiten mit der Stadt Annweiler"
eichhoernchen: |
  Versuche doch mal, in der Hocke weiter zu laufen. Ganz schön anstrengend, nicht wahr?
