title: 13. Richtung Osterbrunnen
fuchs: |
  Im Pfälzer Wald gibt es ein dichtes Netz an Rastmöglichkeiten für Wanderer. Allein der Pfälzerwald-Verein
  unterhält über 100 Schutzhütten, die meisten davon frei zugänglich, mit Sitzgelegenheiten und oft
  auch einer Feuerstelle ausgestattet.

  Daneben gibt es bewirtschaftete Hütten, die an Wochenenden und Feiertagen geöffnet sind und regionale
  Spezialitäten wie Saumagen, Bratwurst oder Pfälzer Weine anbieten.

  Einfache Bänke entlang der Wege laden immer wieder zum kurzen Verweilen ein und wurden oft von ortsansässigen
  Vereinen oder Privatpersonen gestiftet. Schau Dich mal um, ob Du auf den Bänken in der Umgebung Widmungen oder kleine
  Tafeln entdecken kannst.
eichhoernchen: |
  Von hier aus führt der schmale Pfad weiter bis zu einem breiten Weg. Versuche ihn in möglichst wenigen
  Schritten zu erreichen.
