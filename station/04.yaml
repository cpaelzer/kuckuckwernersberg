title: 4. Unter dem Wachtfelsen
fuchs: Die Geologie des Pfälzerwaldes wird hauptsächlich von Buntsandstein- und Zechstein-Gesteinsschichten
  geprägt, die im Perm und zu Beginn der Trias unter wüstenhaften Bedingungen abgelagert wurden. Es gibt
  verschiedene Sedimentabfolgen, darunter stark verfestigte Sandsteine und feinkörnige, tonig gebundene
  Sandsteine. Man unterscheidet zwischen Felszonen mit einheitlicher und heterogener Gesteinsstruktur.
  Vor etwa 48 Millionen Jahren begann der Einbruch des Oberrheingrabens und führte zu einer tektonischen Umlagerung
  der Gesteinsformationen, die ungleichmäßig gehoben und zerbrochen wurden, wodurch der Buntsandstein
  heute freigelegt und schräggestellt erscheint. Sandstein ist nicht nur ein wichtiger Baustein der Natur, sondern
  auch ein Zeugnis der geologischen Geschichte unserer Region.
eichhoernchen: Suche die verschiedenen Schichten im Sandstein! Jede unterschiedliche Schicht stammt aus
  verschiedenen Zeiten - Reise in die Vergangenheit und zähle, wie viele verschiedene Schichten Du entdecken
  kannst. Viel Spaß beim Entdecken und Forschen.
