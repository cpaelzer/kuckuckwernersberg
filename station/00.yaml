title: Willkommen

story: |
  Hoch oben am Rothenberg, in einer alten knorrigen Kiefer, wohnt ein ganz
  besonderer Kuckuck. Sein Name ist Werner – Kuckuck Werner! Eigentlich ruft
  Werner jedes Jahr pünktlich zum Frühling sein fröhliches „Ku-ckuck" über die
  Dächer von Wernersberg. Doch in diesem Jahr ist etwas seltsam: Werner ist
  verschwunden! Niemand hat ihn gehört, niemand hat ihn gesehen.

  Die Tiere des Waldes sind in großer Sorge: Wo steckt nur Kuckuck Werner? Hat
  er sich versteckt? Braucht er Hilfe? Deshalb haben sich seine tierischen
  Freunde – der schlaue Fuchs, das flinke Eichhörnchen und viele Vögel –
  zusammengetan und einen Suchtrupp gebildet. Sie brauchen dringend deine
  Unterstützung!

  Begib dich auf die Spur von Kuckuck Werner rund um den Rothenberg und hilf
  mit, ihn zu finden. Auf deinem Weg erwarten dich spannende Rätsel, lustige
  Bewegungsspiele und viele interessante Geschichten über den Wald und seine
  Bewohner.

howto: |
  Im Wald findest du an vielen Stellen kleine Schilder mit QR-Codes. Scanne den
  QR-Code mit deinem Smartphone – schon öffnet sich die passende Stationsseite.

  Auf jeder Seite findest du drei Abschnitte:

  - **Fuchs: „Schon gewusst?"** – Spannendes Wissen über Wald, Tiere und Geschichte
  - **Eichhörnchen: „Schon bewegt?"** – Lustige Bewegungsspiele für zwischendurch
  - **Kuckuck: „Schon gehört oder gar gefunden?"** – Finde den versteckten Vogel und erkenne ihn an seiner Silhouette

  Am Ende des Weges wartet eine Überraschung auf dich. Bist du bereit? Dann
  nichts wie los – Kuckuck Werner wartet auf dich!

outro: Viel Spaß auf deiner Entdeckungstour!