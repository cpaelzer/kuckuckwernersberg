title: 8. Heidelbeer-Fläche
fuchs: 'Die leckeren Heidelbeeren, die hier einfach so im Wald wachsen, sind eine wahre Köstlichkeit.
  Doch heute sind sie leider mit einem Risiko verbunden: dem Fuchsbandwurm. Dieser Parasit verhindert,
  dass wir die Heidelbeeren wie früher einfach einsammeln und essen können. Auch die Walderdbeeren sind
  davon betroffen, obwohl sie hier nicht zu finden sind. Selbst waschen oder gar einfrieren tötet die
  Eier nicht ab - Es ist daher leider wichtig, vorsichtig zu sein!'
eichhoernchen: Baut ein kleines Minatur-Tipi aus Kiefernnadeln die hier überall zu finden sind
