title: 12. Wachtfels
fuchs: |
  Von hier aus hast Du einen fantastischen Ausblick!

  In der Nähe gibt es viel zu entdecken: In der Mitte unten kannst Du den Ort Wernersberg sehen, mit seiner
  Kirche, dem Kindergarten und auch die Kapelle am Ortsrand ist gut zu erkennen.

  Und in nicht allzu großer Entfernung warten die nächsten tollen Wanderungen, wie zum Beispiel der Premiumwanderweg
  von den Geiersteinen zum “Runde Hut”.

  Weitreichend: Wir befinden uns hier im deutschen Teil des grenzüberschreitenden
  [Biosphärenreservates Pfälzerwald-Nordvogesen](https://www.pfaelzerwald.de/biosphaerenreservat/) - Der
  Pfälzerwald ist das größte zusammenhängende Waldgebiet Deutschlands.
eichhoernchen: |
  Sicherheit ist stets wichtig am Fels. Setze dich hin und schaue, wie viel Du entdecken kannst! Bewege
  nur Deinen Kopf und Deine Augen und beobachte die Umgebung. Es ist erstaunlich, wie viel man sehen kann,
  wenn man sich die Zeit nimmt und genau hinschaut. Das trainiert nicht nur Deine Beobachtungsgabe, sondern
  ist auch eine entspannende Übung für zwischendurch!

  Wie weit denkst Du, ist die große Burg Trifels von Dir entfernt?

  Lösung: Für den einen wirkt es weiter, für den anderen näher als man denkt; es sind ca. 4,1 km.
