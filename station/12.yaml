title: 12. Wachtfels
fuchs: 'Von hier aus hast du einen fantastischen Ausblick!

  In der Nähe gibt es viel zu sehen: In der Mitte unten kannst Du den Ort Wernersberg sehen, mit seiner
  Kirche, dem Kindergarten und auch die Kapelle am Ortsrand ist gut zu erkennen.

  Und in nicht allzu großer Entfernung warten die nächsten tollen Wanderungen wie zum Beispiel der Premiumwanderweg
  von den Geiersteinen zum “Runde Hut”.

  Weitreichend: Info zum Biosphärenreservat und dem größen zusammenhängenden Waldgebiet gemeinsam mit
  dem Bereich in Frankreich.'
eichhoernchen: 'Sicherheit ist wichtig. Setze dich hin und schaue, wie viel du entdecken kannst! Bewege
  nur deinen Kopf und deine Augen und beobachte die Umgebung. Es ist erstaunlich, wie viel man sehen kann,
  wenn man sich die Zeit nimmt und genau hinschaut. Das trainiert nicht nur deine Beobachtungsgabe, sondern
  ist auch eine entspannende Übung für Zwischendurch!

  Wie weit denkst Du, ist die große Burg Trifels von Dir entfernt?

  Für den einen wirkt es weiter für den anderen näher als man denkt, es sind ca 4,1 km'
